			shellScript = "# The two size ratchets, applied to the bundle that was just built.\n#\n# It lives HERE, as the app target's last phase, rather than as an extra command in\n# the QA chain, because the artifact it measures only exists inside an xcodebuild\n# build -- and putting it in the chain would be one more step to forget. A regression\n# fails the build, which is the closing `xcodebuild ... test` of the Swift chain.\n#\n# `size -m` is a host tool, so this cannot be an in-simulator test. /usr/bin/python3\n# ships with the Command Line Tools; the script imports only the standard library.\nset -e\nPYTHON=\"$(command -v python3 || echo /usr/bin/python3)\"\nexec \"$PYTHON\" \"$SRCROOT/../../../scripts/ios_budget.py\" \"$TARGET_BUILD_DIR/$WRAPPER_NAME\"\n";
