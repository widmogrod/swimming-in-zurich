			shellScript = "# S4 acceptance 3: the compile-time plural guarantee `plurals.ts` gives the web.\n#\n# Xcode has no counterpart. There is no build error and no documented build warning for\n# a .xcstrings plural variation that omits a category: at runtime Foundation falls back\n# to `other`, which in Polish is the DECIMAL form -- so the singular-genitive is printed\n# where the plural-genitive belongs. That is exactly the broken grammar the hand-rolled\n# i18n runtime exists to prevent, and it is invisible to everything Apple ships.\n#\n# So the guarantee is rebuilt here: the script emits `error:` lines, which Xcode surfaces\n# as build errors, and a missing category fails the build -- the same place the\n# TypeScript side fails. It runs BEFORE Sources so a broken catalog is reported first.\n#\n# python3 rather than node: an Xcode build phase is not a login shell and node is not\n# guaranteed on its PATH, whereas /usr/bin/python3 ships with the Command Line Tools.\n# scripts/ios_budget.py (the size ratchet phase) made the same call.\nset -e\nPYTHON=\"$(command -v python3 || echo /usr/bin/python3)\"\nCATALOG=\"$SRCROOT/../Sources/SwimZHKit/Resources/Localizable.xcstrings\"\nexec \"$PYTHON\" \"$SRCROOT/../../../scripts/xcstrings_plural_gate.py\" \"$CATALOG\"\n";
