# Canonical pool identity registry + crosswalk into other data sources' namespaces.
#
# This is the single source of canonical facility IDs. Providers resolve external names
# into these IDs by LOOKUP (see domain/registry.py) — never by fuzzy matching. Facilities
# listed here without a curated pool file under data/pools/ are reported as "uncurated"
# (identity known, schedule not yet curated) — distinct from "closed".
#
# The canonical id is the catalog slug (`slug(name)`, see domain/catalog.slug), so a
# facility here and its catalog.json entry share ONE key: every facility_id below is a
# catalog pool_id (referential integrity). The pre-unification short ids (`city`,
# `oerlikon`, …) are preserved LOSSLESSLY as aliases so every legacy id still resolves by
# lookup (registry.resolve_name).
#
# geo_sport_id values are placeholders (null) until wired from the geo_sport provider.

facilities:
  # --- curated (have a schedule file under data/pools/) ---
  - facility_id: "hallenbad-city"
    name: "Hallenbad City"
    kind: "indoor"
    geo_sport_id: null
    crowdmonitor_keys: ["City", "Hallenbad City", "Sportbad City"]
    # Real Baditicker feed poiid (verified against tests/providers/fixtures/baditicker.xml).
    # Baditicker covers the indoor Hallenbäder (City, Oerlikon, …) too.
    baditicker_poiid: "hb001"
    aliases: ["city", "City", "Sportbad City"]

  - facility_id: "hallenbad-oerlikon"
    name: "Hallenbad Oerlikon"
    kind: "indoor"
    geo_sport_id: null
    crowdmonitor_keys: ["Oerlikon", "Hallenbad Oerlikon"]
    baditicker_poiid: "hb004"  # real feed poiid (tests/providers/fixtures/baditicker.xml)
    aliases: ["oerlikon", "Oerlikon"]

  - facility_id: "hallenbad-bungertwies"
    name: "Hallenbad Bungertwies"
    kind: "indoor"
    geo_sport_id: null
    crowdmonitor_keys: ["Bungertwies", "Hallenbad Bungertwies"]
    baditicker_poiid: "hb002"  # real feed poiid (tests/providers/fixtures/baditicker.xml)
    aliases: ["bungertwies", "Bungertwies"]

  - facility_id: "schulschwimmanlage-aemtler"
    name: "Schulschwimmanlage Aemtler"
    kind: "school"
    geo_sport_id: null
    crowdmonitor_keys: []
    aliases: ["aemtler", "Aemtler", "Schulschwimmanlage Aemtler"]

  # --- known but not yet curated (identity only) ---
  - facility_id: "hallenbad-altstetten"
    name: "Hallenbad Altstetten"
    kind: "indoor"
    aliases: ["altstetten", "Altstetten"]

  - facility_id: "hallenbad-blaesi"
    name: "Hallenbad Bläsi"
    kind: "indoor"
    baditicker_poiid: "hb005"  # real feed poiid (tests/providers/fixtures/baditicker.xml)
    aliases: ["blaesi", "Bläsi", "Blaesi"]

  - facility_id: "hallenbad-leimbach"
    name: "Hallenbad Leimbach"
    kind: "indoor"
    baditicker_poiid: "hb006"  # real feed poiid (tests/providers/fixtures/baditicker.xml)
    aliases: ["leimbach", "Leimbach"]

  - facility_id: "waermebad-kaeferberg"
    name: "Wärmebad Käferberg"
    kind: "thermal"
    baditicker_poiid: "hb007"  # real feed poiid (tests/providers/fixtures/baditicker.xml)
    aliases: ["kaeferberg", "Käferberg", "Kaeferberg", "Wärmebad Käferberg"]

  # Outdoor pin, no curated schedule — but a registry identity so its external live-data keys
  # (crowdmonitor today, baditicker next) survive onto the location-only facility the build
  # mints for it. `crowdmonitor_keys` is empty (CrowdMonitor covers indoor baths only); the
  # `aliases` prove the registry identity reaches the mint (S2 adds `baditicker_poiid: fb012`).
  - facility_id: "freibad-heuried"
    name: "Freibad Heuried"
    kind: "outdoor"
    crowdmonitor_keys: []
    # Real Baditicker poiid (verified live 2026-07-25: fb012 = 23 °C). This uncurated pin has no
    # curated schedule, yet its live water temp rides on the S1 location-only mint's registry
    # identity through gold to `/pools/freibad-heuried`.
    baditicker_poiid: "fb012"
    aliases: ["heuried", "Freibad Heuried"]

  # --- S4: Baditicker roster keys for the remaining reconcilable catalog pools -------------
