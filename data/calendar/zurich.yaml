# Zürich calendar overlays — public holidays and school holidays (Ferien).
#
# These drive future-date schedule resolution (term vs holiday, holiday closures).
# Dates are approximate for illustration and MUST be verified against official sources
# before relying on them; school-holiday weeks in particular shift year to year.
#   - Public holidays (canton ZH): zh.ch
#   - School holidays (Volksschule Stadt Zürich): stadt-zuerich.ch / schulferien.org
# valid_as_of: 2026-09-16
#
# 2027: public holidays seeded (fixed dates + the Easter-derived four, Easter Sunday 2027-03-28).
# 2027 school holidays are NOT seeded yet — no scraped rule is term-scoped today (the scraper
# emits DayScope.ALWAYS), so nothing in the shipped store reads them; add them from the
# city's 2027 Ferienplan when a term-scoped source lands.

