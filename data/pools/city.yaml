# Hallenbad City — thin CROSSWALK only (delete-curated-schedule-tier S3).
#
# No curated schedule/price/physical payload: the schedule is scraped, the basin physicals come
# from the WFS `infrastruktur` prose (`apply_physicals`), and identity/address/geo from the WFS
# roster. This file carries ONLY the URL→basin lane binding. The `50m-Becken` basin is named to
# the WFS prose segment ("Schwimmerbecken") so `apply_physicals` matches it and populates its
# 50 x 15 m / 6-lane physicals. The lane binding itself is URL-keyed, so the rename is safe.

facility_id: "hallenbad-city"

basins:
  - basin_id: "city-50m"
    name: "Schwimmerbecken"
    lane_plan_source:
      url: "https://www.stadt-zuerich.ch/content/dam/web/de/stadtleben/sport-und-erholung/dokumente/badeanlagen/belegungsplaene/city-schwimmerbecken.pdf"
