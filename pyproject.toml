[project]
name = "swimzh"
version = "0.1.0"
description = "Typed data core for answering 'where can I go swimming in Zurich indoor pools?'"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Belegungsplan (lane-reservation) PDF parsing — lazy-imported in providers/belegungsplan.py.
pdf = ["pdfplumber>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swimzh"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "TRY", "RUF"]
ignore = [
    # We use typographic dashes (– —) deliberately in prose/comments; don't flag them.
    "RUF001", "RUF002", "RUF003",
    # TRY003: we intentionally pass informative messages to domain exceptions
    # (ValueError in validators, httpx exceptions in test doubles); this rule fights that.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"apps/**/tests/**" = ["S101"]
# The UI page is one self-contained HTML/CSS/JS string; long lines are expected.
"apps/web/api/ui/router.py" = ["E501"]
# Vendored QA gate script legitimately shells out to `radon` by name.
"scripts/**" = ["S603", "S607"]
# The JS unit-test bridge legitimately shells out to the pinned `node` binary
# (resolved via shutil.which, fixed args) to run `node --test`; S603's
# untrusted-input heuristic is a false positive here, same as scripts/ above.
"apps/web/tests/test_static_js.py" = ["S603"]

# Canonical type checker for the QA chain is mypy strict (below). The pyright config is
# kept because the codebase was authored against it and it also passes; both agree.
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "apps"]
# The vendored CRAP gate script is a tool, not project source; don't type-check it.
exclude = ["^scripts/"]

# pdfplumber ships no type stubs; it is an optional extra, lazy-imported in the provider.
[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
    "-q",
    "--cov=swimzh",
    "--cov=apps",
    "--cov-report=term-missing",
    "--cov-report=json",
]
testpaths = ["tests", "apps/web/tests"]

[tool.coverage.run]
source = ["src", "apps"]
branch = true

[tool.coverage.report]
# Calibrated to current coverage (95.61%, after Plan C deleted the legacy geo pipeline +
# `facility` table) rounded down, as a no-regression floor; ratchet up as coverage grows.
fail_under = 95

[tool.crap]
threshold = 30.0
min-complexity = 5

# TypeScript CRAP gate (scripts/crap_ts.mjs) — FORMULA parity with [tool.crap] above
# (cc²·(1−cov)³ + cc; offender when cc > min-complexity AND crap > threshold). ESLint's
# cyclomatic count differs algorithmically from radon's, so this is its own no-regression
# ratchet; calibrated to current TS reality (max is urlstate.ts fromParams: cc 20 @ 100% cov
# → CRAP 20), same 30/5 bar as the Python gate. Raise as coverage grows; never lower to pass.
[tool.crap-ts]
threshold = 30.0
min-complexity = 5

[dependency-groups]
dev = [
    "fastapi>=0.139.2",
    "mypy>=2.3.0",
    "pdfplumber>=0.11",
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-recording>=0.13.4",
    "radon>=6.0.1",
    "ruff>=0.15.22",
    "types-pyyaml>=6.0.12.20260518",
    "uvicorn>=0.51.0",
    "vcrpy>=8.3.0",
]
# pytest-recording: never touch the network during replay unless explicitly re-recording.
# (record mode is opt-in via --record-mode=once on first capture)
