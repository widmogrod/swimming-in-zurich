name: qa

on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync

      # Same commands, same order as the local chain (crap reads pytest's coverage.json).
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy .
      - name: pytest (+ coverage floor)
        run: uv run pytest
      - name: CRAP gate
        run: uv run python scripts/crap.py

  # Separate, self-contained TypeScript chain (its own Node toolchain). S3 extends this
  # job with the crap gate; S2 added lint/fmt/vitest.
  ts-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/static/js
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dependencies
        run: npm ci

      - name: Build (tsc emit static/js -> static/dist)
        run: npm run build

      - name: Type-check (strict, source + tests)
        run: npm run type-check

      - name: Lint (eslint, migrated .ts)
        run: npm run lint

      - name: Format check (prettier, migrated .ts + configs)
        run: npm run fmt:check

      - name: Test (vitest + V8 coverage)
        run: npm run test

      # CRAP reads the coverage vitest just wrote — must run AFTER test (mirrors pytest→crap).
      - name: CRAP gate (TS, formula-parity with scripts/crap.py)
        run: npm run crap

  # The Swift chain. SEPARATE job and pinned to macOS: the `qa` job above is ubuntu-latest
  # and cannot build SwiftUI at all. `swift format` ships with Xcode, so no third-party
  # linter is installed. From S2b this job also runs `scripts/crap_swift.py`, which reads
  # the coverage `swift test` writes — which is why the order below is fixed.
  ios-qa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The chain needs iOS 26 and Swift 6.2 (`isolated deinit`); the runner image ships
      # several Xcodes and does not always default to the newest.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || xcodebuild -version

      # The CRAP gate below is Python — beside scripts/crap.py, one interpreter the repo
      # already has, and no build of its own before the chain can run it — so this job
      # needs uv too. The gate itself imports only the standard library.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `App` as well as the package: `swift build` below compiles only the package, so
      # without it the SwiftUI layer — the one S3a grows most — would drift unchecked.
      - name: Format lint (swift format, strict — package AND app)
        working-directory: apps/ios
        run: swift format lint --strict --recursive Sources Tests App

      - name: Build the package
        working-directory: apps/ios
        run: swift build

      # SwiftPM only: no simulator, no network. This is where the rule layer is proved,
      # including the replay of the generated eligibility contract and the golden answers.
      # --enable-code-coverage is what the CRAP gate below reads; without it that gate has
      # no input at all, which is why the two steps are adjacent and in this order.
      - name: Test the package (with coverage)
        working-directory: apps/ios
        run: swift test --enable-code-coverage

      # Order is load-bearing, exactly as pytest->crap.py and vitest->crap_ts.mjs: this
      # reads the coverage the step above writes and is stale without it. It scores
      # Sources/SwimZHKit only - the thin app target is excluded, because a SwiftUI view
      # body reports inflated executable lines and cannot be unit-tested headlessly.
      - name: CRAP gate (Swift)
        run: uv run python scripts/crap_swift.py

      # The gate's OWN tests, and they run here rather than only in the ubuntu `qa` job
      # because two of them - the CRAP offender path and the coverage join - skip without
      # `apps/ios/.build`, which that job never has. Without this step they would be dead
      # code in CI on every runner. After the CRAP step so the build directory and the
      # coverage data exist; --no-cov because the coverage floor belongs to the Python
      # chain alone and must not be computed from this partial selection.
      - name: Gate self-tests (crap_swift + ios_budget)
        run: uv run pytest tests/scripts --no-cov

      # The app target cannot be imported by `swift test`, so the compile check and the
      # app-hosted tests need a simulator. `-project` is required: with none, xcodebuild
      # searches the cwd, which holds Package.swift and no .xcodeproj.
      # Also where the size ratchet fires: scripts/ios_budget.py is the app target's last
      # build phase, so a regression in app_minus_sqlite or sqlite fails this step.
      - name: Build and test the app in the simulator
        working-directory: apps/ios
        run: |
          xcodebuild -project App/SwimZH.xcodeproj -scheme SwimZH \
            -destination 'platform=iOS Simulator,name=iPhone 17' test
