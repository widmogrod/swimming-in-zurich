name: qa

on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync

      # Same commands, same order as the local chain (crap reads pytest's coverage.json).
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy .
      - name: pytest (+ coverage floor)
        run: uv run pytest
      - name: CRAP gate
        run: uv run python scripts/crap.py
