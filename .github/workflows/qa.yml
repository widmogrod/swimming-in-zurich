name: qa

on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync

      # Same commands, same order as the local chain (crap reads pytest's coverage.json).
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy .
      - name: pytest (+ coverage floor)
        run: uv run pytest
      - name: CRAP gate
        run: uv run python scripts/crap.py

  # Separate, self-contained TypeScript chain (its own Node toolchain). S2/S3 extend this
  # job with lint/fmt/vitest/crap; here it just proves the build + type-check are green.
  ts-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/static/js
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dependencies
        run: npm ci

      - name: Build (tsc emit static/js -> static/dist)
        run: npm run build

      - name: Type-check (strict, source)
        run: npm run type-check
