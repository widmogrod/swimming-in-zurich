# The release chain. NOTHING here runs on a push — `qa.yml` is the every-push gate, and this
# job set fires only when a GitHub Release is PUBLISHED. That is deliberate: it builds the gold
# store from the live network (minutes, and it can fail on somebody else's website), it burns an
# App Store build number, and it submits to Apple review. None of those belong on a branch push.
#
# Three jobs, in order, because they need three different things:
#   store — ubuntu, network, python: builds gold.sqlite and projects the release store.
#   pages — deploys that store + manifest.json, so the URL in the app's Info.plist resolves.
#   app   — macOS, Xcode, signing: archives, uploads, submits.
name: release

on:
  release:
    types: [published]
  # A dry run: everything except the App Store upload. Use it after touching this file.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and export, but do not upload to App Store Connect"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# Two releases at once would race on the build number and on Pages. Never cancel a run that
# may already have uploaded a build.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------------------
  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync

      # NETWORK-DEPENDENT and the slowest step here: WFS roster + every page scraper. The build
      # is atomic — any provider failure aborts non-zero and nothing downstream runs, which is
      # exactly what we want before an App Store submission.
      - name: Build the gold store
        run: uv run python -m swimzh.cli build --db gold.sqlite

      # Projects gold into the pre-resolved iOS store AND writes manifest.json, whose `url`
      # field is IOS_STORE_URL. That URL must be where `pages` below publishes it, or an
      # installed app downloads a 404 forever.
      - name: Export the release store + manifest
        run: make ios-release IOS_STORE_URL='${{ vars.IOS_STORE_URL }}'

      - name: Report what shipped
        run: ls -l dist/ios && cat dist/ios/manifest.json

      # For the `app` job, which needs the same bytes the manifest hashed.
      - name: Upload the store for the app job
        uses: actions/upload-artifact@v4
        with:
          name: ios-store
          path: dist/ios
          retention-days: 7

      # The App Store listing must name a reachable privacy policy, and Pages is already
      # publishing from this directory — so the page ships beside the store rather than
      # needing a second host. `docs/pages/` is the whole published site apart from the store.
      - name: Add the static pages beside the store
        run: cp -R docs/pages/. dist/ios/

      - name: Upload the store for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ios

  # ---------------------------------------------------------------------------------------
  # Publishing BEFORE the app is submitted is the safe order: the store is validated by the
  # client (bytes -> sha256 -> not-WAL -> integrity_check -> schema_version -> sqlite_stat1)
  # and a schema it cannot read is ignored, so an early publish can never brick an old build.
  pages:
    needs: store
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------------------
  app:
    needs: [store, pages]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Same reason as `ios-qa` in qa.yml: the chain needs iOS 26 and Swift 6.2, and the runner
      # image does not always default to the newest Xcode.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dependencies
        working-directory: apps/web/static/js
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The iOS string catalog is a projection of the web catalogs. A stale one would ship
      # wrong sentences in four languages, so it is checked here as well as in qa.yml.
      - name: Locale catalog is not stale
        run: make ios-locales-check

      - name: Download the release store
        uses: actions/download-artifact@v4
        with:
          name: ios-store
          path: dist/ios

      # THE OFFLINE FLOOR. The committed resource is the cassette-replayed TEST fixture
      # (scripts/ios_fixtures.py says so) — shipping it would give a new install months-old
      # data until its first successful refresh. Overwritten here and never committed, so the
      # Swift golden tests in qa.yml keep replaying against the fixture they were built from.
      - name: Ship the fresh store as the bundled floor
        run: |
          cp dist/ios/ios.sqlite apps/ios/Sources/SwimZHKit/Resources/ios.sqlite
          ls -l apps/ios/Sources/SwimZHKit/Resources/ios.sqlite

      # Version comes from the release tag ("v1.2.3" and "1.2.3" both work); the build number
      # from the run number, which never repeats. App Store Connect rejects a build number it
      # has already seen, so this must not be a constant.
      - name: Derive the version numbers
        id: version
        run: |
          tag='${{ github.event.release.tag_name }}'
          version="${tag#v}"
          [ -n "$version" ] || version="0.0.${GITHUB_RUN_NUMBER}"
          echo "marketing=$version" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "shipping $version (build ${GITHUB_RUN_NUMBER})"

      # A throwaway keychain with a throwaway password. The password is generated here rather
      # than kept as a secret: it protects a keychain that exists for one job on one runner.
      - name: Install the distribution certificate
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI prompt nobody can answer and the job hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # `-allowProvisioningUpdates` needs the API key ON DISK, in a directory it searches.
      #
      # ACCEPTS THE KEY IN EITHER FORM, and checks it before anything slow runs. The secret is
      # meant to be the `.p8` base64-encoded, because a PEM's real newlines do not always
      # survive being pasted into a secret — but pasting the PEM itself is the obvious mistake,
      # and it is one this workflow can simply absorb. It did happen: a raw PEM was
      # base64-DECODED into gibberish here and surfaced twenty minutes later, inside the
      # archive, as `CryptoKit.CryptoKitASN1Error.invalidPEMDocument` — an error naming neither
      # the secret nor the step that wrote it.
      #
      # So: a value that already looks like a PEM is written through unchanged, anything else is
      # decoded, and either way the RESULT is checked for the PEM header. A bad key now fails
      # here, in seconds, saying which secret to fix.
      - name: Place the App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          key="$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          if printf '%s' "$ASC_PRIVATE_KEY" | head -c 27 | grep -q -- "-----BEGIN"; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$key" || {
              echo "ASC_PRIVATE_KEY is neither a PEM nor valid base64 of one."
              echo "Re-set it with: base64 -i AuthKey_XXXXXXXXXX.p8 | gh secret set ASC_PRIVATE_KEY"
              exit 1; }
          fi
          if ! head -1 "$key" | grep -q -- "-----BEGIN .*PRIVATE KEY-----"; then
            echo "ASC_PRIVATE_KEY did not resolve to a private key. First line was:"
            head -c 40 "$key"; echo
            echo "Re-set it with: base64 -i AuthKey_XXXXXXXXXX.p8 | gh secret set ASC_PRIVATE_KEY"
            exit 1
          fi
          echo "API key placed for key id ${{ secrets.ASC_KEY_ID }}"

      # Every signing setting is an OVERRIDE, because the checked-in project deliberately has
      # CODE_SIGNING_ALLOWED = NO — that is what lets the qa.yml simulator job build with no
      # certificate at all. Signing is a property of a release, not of the repository.
      #
      # SWIMZHStoreManifestURL is injected the same way and for the same reason: the shipped
      # default is NO manifest (AppCorrectnessTests asserts it), so the weekly refresh is
      # turned on here, in the one build that has somewhere to refresh FROM.
      #
      # NO `CODE_SIGN_IDENTITY` HERE, deliberately. Naming "Apple Distribution" beside
      # CODE_SIGN_STYLE=Automatic is a CONFLICT rather than a hint, and Xcode refuses all
      # three targets with "automatically signed for development, but a conflicting code
      # signing identity Apple Distribution has been manually specified" — which is how the
      # first dry run ended. Automatic signing already picks the distribution identity for an
      # `archive` action: the identity follows the ACTION, so naming it can only disagree.
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          STORE_URL: ${{ vars.IOS_STORE_URL }}
        run: |
          manifest_url="$(dirname "$STORE_URL")/manifest.json"
          echo "manifest: $manifest_url"
          cd apps/ios
          xcodebuild -project App/SwimZH.xcodeproj -scheme SwimZH \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SwimZH.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID '${{ secrets.ASC_KEY_ID }}' \
            -authenticationKeyIssuerID '${{ secrets.ASC_ISSUER_ID }}' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            MARKETING_VERSION='${{ steps.version.outputs.marketing }}' \
            CURRENT_PROJECT_VERSION='${{ steps.version.outputs.build }}' \
            INFOPLIST_KEY_SWIMZHStoreManifestURL="$manifest_url" \
            archive

      - name: Export the IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SwimZH.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID '${{ secrets.ASC_KEY_ID }}' \
            -authenticationKeyIssuerID '${{ secrets.ASC_ISSUER_ID }}'
          ls -l "$RUNNER_TEMP/export"

      # Kept whatever happens next, so a failed upload does not cost the whole build.
      - name: Keep the IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Ruby
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Uploads AND submits for review — the owner chose fully automatic. `skip_metadata` is
      # on because the App Store listing (screenshots, description, keywords) is maintained by
      # hand in App Store Connect; this publishes a BINARY against the existing listing.
      - name: Upload to App Store Connect and submit for review
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: |
          ipa="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          bundle exec fastlane ios publish ipa:"$ipa" \
            version:'${{ steps.version.outputs.marketing }}'
